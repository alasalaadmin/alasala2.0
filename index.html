<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>تطبيق المتابعة</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#064e3b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المتابعة">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-amiri {
      font-family: 'Amiri', serif;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 12px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(251, 191, 36, 0.18);
    }
    .glass-panel {
      background: rgba(6, 78, 59, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.25);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- ========================================== -->
  <!-- 1. شاشة تسجيل الدخول (LOGIN VIEW)         -->
  <!-- ========================================== -->
  <div id="loginView" class="relative min-h-screen w-full flex items-center justify-center p-4 bg-cover bg-center" style="background-image: url('./Cover.webp');">
    <!-- غطاء ناعم بدون تشويش للحفاظ على جمالية الصورة -->
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-slate-950/60 to-slate-950/85"></div>

    <div class="relative w-full max-w-sm glass-card rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 text-center border border-amber-300/20">
      
      <div class="space-y-1">
        <h1 class="text-3xl font-black text-amber-300 font-amiri tracking-wide">تطبيق المتابعة</h1>
        <p class="text-xs text-slate-300 font-medium">بوابة تسجيل حضور وغياب الطلاب</p>
      </div>

      <!-- نموذج تسجيل الدخول بالبريد والرمز -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-right">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 mr-1">البريد الإلكتروني للأستاذ</label>
          <input 
            type="email" 
            id="teacherEmail" 
            required
            placeholder="name@example.com" 
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 mr-1">رمز الدخول (PIN)</label>
          <input 
            type="password" 
            id="teacherPin" 
            required
            maxlength="10"
            placeholder="••••••" 
            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white tracking-widest text-center placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-base transition"
          >
        </div>

        <button 
          type="submit" 
          id="loginBtn"
          class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] shadow-lg shadow-emerald-900/40 border border-emerald-400/30 transition flex items-center justify-center space-x-2 space-x-reverse text-sm"
        >
          <span>تسجيل الدخول</span>
        </button>
      </form>

      <!-- زر تحميل التطبيق المباشر -->
      <div class="pt-2 border-t border-slate-800">
        <a 
          href="./app.apk" 
          download="app.apk"
          class="inline-flex items-center justify-center text-xs font-bold text-amber-300/90 hover:text-amber-200 py-2 px-3 rounded-lg bg-amber-400/10 hover:bg-amber-400/15 border border-amber-300/20 transition active:scale-95 space-x-1.5 space-x-reverse"
        >
          <svg class="w-4 h-4 ml-1.5 fill-current" viewBox="0 0 20 20">
            <path d="M10 2a.75.75 0 01.75.75v8.69l2.22-2.22a.75.75 0 111.06 1.06l-3.5 3.5a.75.75 0 01-1.06 0l-3.5-3.5a.75.75 0 111.06-1.06l2.22 2.22V2.75A.75.75 0 0110 2zM3.5 13.75a.75.75 0 01.75.75v1c0 .414.336.75.75.75h10a.75.75 0 01.75-.75v-1a.75.75 0 011.5 0v1A2.25 2.25 0 0115 18H5a2.25 2.25 0 01-2.25-2.25v-1a.75.75 0 01.75-.75z"/>
          </svg>
          <span>تحميل تطبيق الهاتف مباشرة (APK)</span>
        </a>
      </div>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. الصفحة الرئيسية (MAIN DASHBOARD VIEW)   -->
  <!-- ========================================== -->
  <div id="mainView" class="hidden flex-1 flex flex-col safe-top safe-bottom max-w-lg mx-auto w-full px-4 pb-6 space-y-4">

    <!-- شريط هوية الأستاذ المدمج (Compact Teacher Identity Bar) -->
    <header class="glass-panel rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg border border-emerald-500/20">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-10 h-10 rounded-xl bg-emerald-950 border border-emerald-400/40 flex items-center justify-center text-amber-300 font-bold text-base shadow-inner">
          <span id="teacherInitial">م</span>
        </div>
        <div>
          <div class="flex items-center space-x-2 space-x-reverse">
            <h2 id="teacherDisplayName" class="text-sm font-bold text-white">الأستاذ</h2>
            <span id="teacherGroupBadge" class="text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-400/30">الفوج أ</span>
          </div>
          <p id="currentDateDisplay" class="text-[11px] text-slate-400">الجمعة، 30 أكتوبر</p>
        </div>
      </div>

      <!-- مؤشر المزامنة والاتصال (Offline / Sync Status Indicator) -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <div id="syncIndicator" class="flex items-center space-x-1.5 space-x-reverse bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-700 text-[10px]">
          <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="syncText" class="text-slate-300 font-medium">متزامن</span>
        </div>
        <button onclick="logout()" class="p-2 text-slate-400 hover:text-rose-400 active:scale-95 transition" title="تسجيل الخروج">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </header>

    <!-- بطاقة الحصة الحالية / المباشرة -->
    <div class="glass-card rounded-2xl p-4 shadow-xl border border-amber-400/20 relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-amber-300 bg-amber-400/10 px-2.5 py-1 rounded-md border border-amber-400/20 flex items-center space-x-1 space-x-reverse">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
          <span>الحصة المقررة</span>
        </span>
        <span class="text-xs text-slate-300" id="lessonTiming">اليوم</span>
      </div>
      <h3 class="text-lg font-black text-white" id="currentSubjectTitle">متابعة الحضور والغياب</h3>
      <p class="text-xs text-slate-400 mt-1" id="currentGroupDetails">حدد حالة الطلاب ثم احفظ التغييرات</p>
    </div>

    <!-- عداد إحصائيات الحصة اللحظي (Quick Stats Counter) -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="glass-panel p-2.5 rounded-xl border border-slate-800">
        <span class="text-[11px] text-slate-400 block mb-0.5">العدد الكلي</span>
        <span id="totalStudentsCount" class="text-base font-black text-white">0</span>
      </div>
      <div class="glass-panel p-2.5 rounded-xl border border-emerald-500/20 bg-emerald-950/20">
        <span class="text-[11px] text-emerald-400 block mb-0.5">الحاضرون</span>
        <span id="presentCount" class="text-base font-black text-emerald-400">0</span>
      </div>
      <div class="glass-panel p-2.5 rounded-xl border border-rose-500/20 bg-rose-950/20">
        <span class="text-[11px] text-rose-400 block mb-0.5">الغائبون</span>
        <span id="absentCount" class="text-base font-black text-rose-400">0</span>
      </div>
    </div>

    <!-- حقل البحث الذكي وتطبيع الحروف (Arabic Fuzzy Search Filter) -->
    <div class="relative">
      <input 
        type="text" 
        id="studentSearchInput" 
        oninput="handleStudentSearch(this.value)"
        placeholder="ابحث عن اسم الطالب..." 
        class="w-full pr-10 pl-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
      >
      <div class="absolute right-3.5 top-3 text-slate-500 pointer-events-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- قائمة الطلاب لتسجيل الحضور (Student Attendance List) -->
    <div class="flex-1 glass-card rounded-2xl p-3 border border-slate-800/80 shadow-inner flex flex-col">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-xs font-bold text-slate-400 px-1">
        <span>قائمة الطلاب (<span id="visibleStudentsCount">0</span>)</span>
        <button onclick="toggleAllAttendance(true)" class="text-emerald-400 hover:text-emerald-300 active:scale-95 transition text-[11px]">
          تحديد الكل كحاضر ✓
        </button>
      </div>

      <!-- الحاوية القابلة للتمرير -->
      <div id="studentsListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scroll max-h-[46vh]">
        <div class="text-center py-10 text-slate-500 text-xs">جاري تحميل القائمة...</div>
      </div>
    </div>

    <!-- زر الحفظ والإرسال السفلي -->
    <div class="pt-1">
      <button 
        onclick="saveAttendanceSheet()" 
        id="saveAttendanceBtn"
        class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] shadow-lg shadow-emerald-950/60 border border-emerald-400/30 transition flex items-center justify-center space-x-2 space-x-reverse text-sm"
      >
        <span>تأكيد وحفظ الحضور</span>
      </button>
    </div>

  </div>

  <script>
    // الإعدادات والمتحولات الأساسية
    const MASTER_PIN = "2AC2027";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzX6-placeholder/exec"; // ضع رابط النشر الخاص بك هنا
    
    let currentTeacher = null;
    let studentsData = [
      { id: 1, name: "إبراهيم أحمد المنصوري", present: true },
      { id: 2, name: "عمر فاروق البشير", present: true },
      { id: 3, name: "خالد سعيد الغامدي", present: false },
      { id: 4, name: "حمزة بن عبد الله", present: true },
      { id: 5, name: "يوسف إدريس المهدي", present: true },
      { id: 6, name: "أحمد بن علي الشريف", present: true },
      { id: 7, name: "فاطمة الزهراء التونسية", present: true }
    ];
    let filteredStudents = [...studentsData];

    // دالة إزالة التشكيل وتطبيع الحروف العربية (Arabic Fuzzy Normalization)
    function normalizeArabicText(text) {
      if (!text) return "";
      return text
        .trim()
        .replace(/[\u064B-\u065F\u0670]/g, "") // إزالة حركات التشكيل والتنوين
        .replace(/[إأآا]/g, "ا")                 // توحيد الألف
        .replace(/ة/g, "ه")                     // توحيد التاء المربوطة
        .replace(/ى/g, "ي");                    // توحيد الياء
    }

    // تهيئة التطبيق عند الفتح
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem("teacher_email");
      if (savedEmail) {
        document.getElementById("teacherEmail").value = savedEmail;
      }
      
      // ضبط تاريخ اليوم باللغة العربية
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('ar-EG', options);

      // مراقبة حالة الاتصال بالشبكة
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      updateNetworkStatus();
    });

    // مراقبة الاتصال والمزامنة
    function updateNetworkStatus() {
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (navigator.onLine) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        text.textContent = "متزامن";
        text.className = "text-slate-300 font-medium";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-amber-400";
        text.textContent = "محلي (أوفلاين)";
        text.className = "text-amber-300 font-medium";
      }
    }

    // تسجيل الدخول
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("teacherEmail").value.trim().toLowerCase();
      const pin = document.getElementById("teacherPin").value.trim();
      const loginBtn = document.getElementById("loginBtn");

      if (pin !== MASTER_PIN) {
        alert("رمز الدخول (PIN) غير صحيح!");
        return;
      }

      loginBtn.innerHTML = "<span>جاري الدخول...</span>";
      loginBtn.disabled = true;

      // حفظ البريد لتسهيل العودة
      localStorage.setItem("teacher_email", email);

      setTimeout(() => {
        currentTeacher = {
          email: email,
          name: email.split('@')[0],
          group: "الفوج الدراسي 1"
        };

        // تحديث واجهة الأستاذ
        document.getElementById("teacherDisplayName").textContent = currentTeacher.name;
        document.getElementById("teacherInitial").textContent = currentTeacher.name.charAt(0).toUpperCase();
        document.getElementById("teacherGroupBadge").textContent = currentTeacher.group;

        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("mainView").classList.remove("hidden");

        renderStudentsList();
        updateQuickStats();
      }, 500);
    }

    // تسجيل الخروج
    function logout() {
      document.getElementById("mainView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("teacherPin").value = "";
      document.getElementById("loginBtn").innerHTML = "<span>تسجيل الدخول</span>";
      document.getElementById("loginBtn").disabled = false;
    }

    // البحث اللحظي مع التطبيع
    function handleStudentSearch(query) {
      const normalizedQuery = normalizeArabicText(query);
      if (!normalizedQuery) {
        filteredStudents = [...studentsData];
      } else {
        filteredStudents = studentsData.filter(s => 
          normalizeArabicText(s.name).includes(normalizedQuery)
        );
      }
      renderStudentsList();
    }

    // عرض قائمة الطلاب
    function renderStudentsList() {
      const container = document.getElementById("studentsListContainer");
      document.getElementById("visibleStudentsCount").textContent = filteredStudents.length;

      if (filteredStudents.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">لا يوجد طالب مطابق لاسم البحث</div>`;
        return;
      }

      container.innerHTML = filteredStudents.map(student => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 transition">
          <span class="text-sm font-semibold text-slate-200">${student.name}</span>
          <div class="flex items-center space-x-1.5 space-x-reverse">
            <button 
              onclick="setStudentAttendance(${student.id}, true)" 
              class="px-2.5 py-1 text-xs rounded-lg font-bold transition ${student.present ? 'bg-emerald-500 text-white shadow-md shadow-emerald-900/40' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}"
            >
              حاضر
            </button>
            <button 
              onclick="setStudentAttendance(${student.id}, false)" 
              class="px-2.5 py-1 text-xs rounded-lg font-bold transition ${!student.present ? 'bg-rose-500 text-white shadow-md shadow-rose-900/40' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}"
            >
              غائب
            </button>
          </div>
        </div>
      `).join('');
    }

    // تعيين حضور طالب فردي
    function setStudentAttendance(id, isPresent) {
      const student = studentsData.find(s => s.id === id);
      if (student) {
        student.present = isPresent;
        renderStudentsList();
        updateQuickStats();
      }
    }

    // تحديد الكل كحاضر
    function toggleAllAttendance(status) {
      studentsData.forEach(s => s.present = status);
      renderStudentsList();
      updateQuickStats();
    }

    // تحديث العدادات العلوية
    function updateQuickStats() {
      const total = studentsData.length;
      const present = studentsData.filter(s => s.present).length;
      const absent = total - present;

      document.getElementById("totalStudentsCount").textContent = total;
      document.getElementById("presentCount").textContent = present;
      document.getElementById("absentCount").textContent = absent;
    }

    // حفظ وإرسال البيانات
    function saveAttendanceSheet() {
      const btn = document.getElementById("saveAttendanceBtn");
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>جاري الحفظ والمزامنة...</span>
      `;

      setTimeout(() => {
        alert("تم حفظ سجل الحضور بنجاح!");
        btn.disabled = false;
        btn.innerHTML = `<span>تأكيد وحفظ الحضور</span>`;
      }, 900);
    }
  </script>
</body>
</html>
