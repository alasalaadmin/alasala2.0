  <div class="w-full bg-slate-950/45 backdrop-blur-2xl border border-white/20 rounded-3xl p-6 sm:p-7 shadow-xl space-y-4">
    <form onsubmit="event.preventDefault(); submitEmailPinLogin();" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-amber-100/90 mb-1.5 text-right">البريد الإلكتروني</label>
        <input type="email" id="loginEmailInput" required placeholder="teacher@example.com" dir="ltr" class="w-full px-4 py-3.5 bg-black/35 border border-white/20 rounded-2xl text-white placeholder-amber-100/40 text-sm focus:outline-none text-left"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-amber-100/90 mb-1.5 text-right">الرمز السري (PIN)</label>
        <input type="password" id="loginPinInput" required placeholder="••••••" dir="ltr" class="w-full px-4 py-3.5 bg-black/35 border border-white/20 rounded-2xl text-white placeholder-amber-100/40 text-sm focus:outline-none text-left num-font tracking-widest"/>
      </div>
      <button type="submit" class="w-full py-3.5 bg-olive-700 hover:bg-olive-600 text-white font-extrabold text-sm rounded-2xl flex items-center justify-center gap-2 cursor-pointer mt-4">
        <span>تسجيل الدخول</span>
      </button>
    </form>
    <div id="loginErrorMsg" class="hidden text-xs text-red-200 bg-red-950/80 p-3 rounded-2xl text-center"></div>
  </div>
</div>


<main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-16 safe-bottom">
  
  <!-- VIEW 1: DASHBOARD -->
  <section id="viewDashboard" class="space-y-4">
    <div class="rounded-2xl py-3.5 px-5 chalkboard-bg text-white text-center">
      <h2 class="handwritten-chalk text-xl font-bold">المتابعة نصف العمل</h2>
    </div>
    <div class="grid grid-cols-2 gap-3.5">
      <button onclick="openAttendanceView()" class="p-5 glass-card rounded-3xl flex flex-col items-center justify-center text-center cursor-pointer min-h-[150px]">
        <h3 class="text-base font-extrabold text-slate-900 mt-2">تسجيل الحضور</h3>
      </button>
      <div onclick="openCoursesView()" class="p-5 glass-card rounded-3xl flex flex-col items-center justify-center text-center cursor-pointer min-h-[150px]">
        <h3 class="text-base font-extrabold text-slate-900 mt-2">قائمة الدروس</h3>
        <p id="dashCoursesCountText" class="text-xs text-slate-500 mt-1 num-font">0 درس</p>
      </div>
      <button onclick="openFollowUpView()" class="col-span-2 p-4 glass-card rounded-3xl flex items-center justify-between text-right cursor-pointer">
        <div>
          <h3 class="text-base font-extrabold text-slate-900">متابعة الغائبين</h3>
          <p id="dashAbsentCountText" class="text-xs text-slate-500 mt-0.5">فحص الغياب المتكرر للطلاب</p>
        </div>
      </button>
    </div>
  </section>

  <!-- VIEW 2: ATTENDANCE -->
  <section id="viewAttendance" class="hidden space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
      <h2 class="text-base font-bold text-slate-900">تسجيل الحضور</h2>
      <button onclick="navigateBack()" class="px-3 py-1.5 bg-slate-200 rounded-xl text-xs font-bold cursor-pointer">الرجوع</button>
    </div>
    <div id="attendanceCoursesGrid" class="space-y-2"></div>
    <div id="attendanceActiveForm" class="hidden space-y-4 pt-2">
      <div class="p-3 bg-olive-50 border border-olive-200 rounded-2xl flex items-center justify-between">
        <span id="activeSelectedCourseTitle" class="text-sm font-black text-olive-900">--</span>
        <button type="button" onclick="resetActiveCourseSelection()" class="text-xs font-bold text-olive-700 underline">تغيير الدرس</button>
      </div>
      <div class="glass-card rounded-3xl p-4 space-y-3">
        <input type="date" id="attDateInput" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"/>
        <select id="attSyllabusSelect" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"><option value="">-- اختر الباب --</option></select>
      </div>
      <div id="attendanceStudentList" class="space-y-2.5"></div>
      <button onclick="submitAttendanceSession()" class="w-full py-3 bg-olive-700 text-white font-extrabold rounded-2xl cursor-pointer">حفظ الحضور والغياب</button>
    </div>
  </section>

  <!-- VIEW 3: COURSES -->
  <section id="viewCourses" class="hidden space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
      <h2 class="text-base font-bold text-slate-900">قائمة الدروس</h2>
      <div class="flex gap-2">
        <button onclick="openCreateCourseModal()" class="px-3 py-2 bg-olive-700 text-white rounded-xl text-xs font-bold cursor-pointer">فتح درس</button>
        <button onclick="navigateBack()" class="px-3 py-1.5 bg-slate-200 rounded-xl text-xs font-bold cursor-pointer">الرجوع</button>
      </div>
    </div>
    <div id="coursesDirectoryList" class="space-y-3"></div>
  </section>

  <!-- VIEW 3B: COURSE STUDENTS -->
  <section id="viewCourseStudents" class="hidden space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
      <h2 id="courseStudentsHeaderTitle" class="text-base font-extrabold text-slate-900">--</h2>
      <div class="flex gap-2">
        <button onclick="openAddStudentForCurrentCourse()" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold cursor-pointer">إضافة طالب</button>
        <button onclick="navigateBack()" class="px-3 py-1.5 bg-slate-200 rounded-xl text-xs font-bold cursor-pointer">الرجوع</button>
      </div>
    </div>
    <div id="courseStudentsDirectoryList" class="space-y-3"></div>
  </section>

  <!-- VIEW 4: FOLLOW UP -->
  <section id="viewFollowUp" class="hidden space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
      <h2 class="text-base font-bold text-slate-900">متابعة الغائبين (3 غيابات متتالية)</h2>
      <button onclick="navigateBack()" class="px-3 py-1.5 bg-slate-200 rounded-xl text-xs font-bold cursor-pointer">الرجوع</button>
    </div>
    <div id="followUpList" class="space-y-3"></div>
  </section>

</main>
